[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reel-watcher"
version = "0.1.0"
description = "A private local library for studying reels and creating original briefs"
requires-python = ">=3.11,<3.14"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "python-multipart>=0.0.20", "httpx>=0.28,<1", "pillow>=11", "yt-dlp>=2025.1", "imageio-ffmpeg>=0.6"]

[project.optional-dependencies]
models = ["mlx-vlm>=0.7.6", "llguidance>=1.9.1", "mlx-whisper>=0.4", "huggingface-hub>=0.30", "pyobjc-framework-Vision>=11; sys_platform == 'darwin'"]

[dependency-groups]
dev = [
    "mypy>=1.15",
    "pytest>=8",
    "ruff>=0.11",
]

[project.scripts]
reel-watcher = "reel_watcher.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
